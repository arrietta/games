<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Игры для уроков</title>
  <link rel="stylesheet" href="engine.css">
</head>
<body>
  <div id="app">
    <header class="bar"><h1>🎲 Игры для уроков</h1></header>
    <main id="stage" style="justify-content:flex-start">
      <div class="catalog" id="list"></div>
    </main>
  </div>
  <script>
    const NAMES = {
      quiz: 'Викторина', truefalse: 'Правда или ложь', match: 'Найди пару', flashcards: 'Карточки',
      anagram: 'Анаграмма', groupsort: 'Сортировка', wheel: 'Колесо фортуны', whack: 'Бей крота',
    };
    fetch('games/index.json').then(r => r.json()).then(list => {
      const box = document.getElementById('list');
      for (const g of list) {
        const slug = encodeURIComponent(g.slug);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = '<div class="muted"></div><a class="big-q" style="font-size:22px;display:block;margin:4px 0 12px"></a>' +
          '<a class="muted pen" style="font-size:15px;display:block">🖊 Перенести в CodePen (для Canva)</a>' +
          '<a class="muted" style="font-size:15px" download>⬇ Файл для Canva</a>';
        card.querySelector('.muted').textContent = NAMES[g.type] || g.type;
        const play = card.querySelector('a.big-q');
        play.href = 'g/' + slug + '/';
        play.textContent = g.title;
        card.querySelector('a[download]').href = 'canva/' + slug + '.html';
        card.querySelector('a.pen').href = 'codepen/' + slug + '.html';
        box.append(card);
      }
    });
  </script>
</body>
</html>
